<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --c: 46; 
        --s: 40;
        --u: min(calc(100vw / (5 * var(--c))));
      }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  box-sizing: border-box;
}
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        font-family: Roboto, sans-serif;
        color: #f1fade;
      }
  .counters {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      justify-content: center;
      width: 100%;
      margin: 0;
      }
      .counter {
        display: flex;
        flex-direction: row;
        align-items: flex-end;
        justify-content: flex-end;
        flex: 0 0 calc(var(--u) * var(--s));
        gap: calc(var(--u) * 1.5);
        padding-right: calc(var(--u) * 2);
        box-sizing: border-box;
      }
      .counter:nth-child(5) {
        padding-left: calc(var(--u) * 14);
      }
      .controls {
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 1.5);
      }
      .count {
        min-width: calc(var(--u) * 14);
        font-size: calc(var(--u) * 8);
        font-weight: bold;
        line-height: calc(var(--u) * 6);;
        text-align: center;
      }
      .row {
        display: flex;
        gap: calc(var(--u) * 1.50);
      }
      button {
        width: calc(var(--u) * 6);
        height: calc(var(--u) * 6);
        padding: 0;
        font-size: calc(var(--u) * 3);
        line-height: 1;
        border: none;
        border-radius: 100%;
        background: #bf4d0f;
        color: #f1fade;
        cursor: pointer;
        -webkit-appearance: none;
        appearance: none;
      }
    </style>
  </head>
  <body>
    <div class="counters" id="counters"></div>
    <script>
   function setUnit() {
  const root = document.documentElement;
  const c = parseFloat(getComputedStyle(root).getPropertyValue('--c'));
  root.style.setProperty('--u', (root.clientWidth / (5 * c)) + 'px');
}
setUnit();
window.addEventListener('resize', setUnit);      
      //starting values for counters, in order
      const START = [0, 0, 0, 0, 100];
      
      //lowest value allowed to be reached
      const MINS = [0, 0, 0, 0, -Infinity];

      //how the counters interact
      const LINKS = {
        1: {2: +1, 5: -3}, //increases to copper ore adds embodied carbon by 1 and reduces cash by 3
        3: {1: -2, 5: -3}, //increases to refined pieces reduces copper ore by 2 and cash by 3
        4: {5: -1} //increases to reclaimed pieces reduces cash by 1
      };

      const values = [...START];
      const display = [];

      function change(i, amount) {
        values[i] = Math.max(MINS[i], values[i] + amount);
      
        //making it so only increases can trigger linked changes, not when cash, etc. is reduced
        if (amount > 0 && LINKS[i + 1]) {
          for (const [target, effect] of Object.entries(LINKS[i + 1])) {
            const t = Number(target) - 1;
            values[t] = Math.max(MINS[t], values[t] + effect * amount);
          }
        }
        render();
      }

      function render() {
        values.forEach((v, i) => {display[i].textContent = v; });
      }
      //need this to make the value re-render with new value

      function makeButton(label, amount, index, extraClass) {
        const b = document.createElement('button');
        b.textContent = label;
        b.className = extraClass || '';
        b.setAttribute('aria-label', 'Counter' + (index + 1) + '  ' + label);
        b.onclick = () => change(index, amount);
        return b;
      }
      //this makes the actual round button using counter
      
      const container = document.getElementById('counters');
      for (let i = 0; i <5; i++) {
        const counter = document.createElement('div');
        counter.className = 'counter';
      //this finds an empty counter, creates a box and applies the counter styling
        
        const count = document.createElement('div');
        count.className = 'count';
        display.push (count);
        //this creates a box that will show the actual count
        
        const controls = document.createElement('div');
        controls.className = 'controls';
        
        const row1 = document.createElement('div');
        row1.className = 'row';
        row1.append(makeButton('-', -1, i), makeButton('+', 1, i));
        controls.append(row1);
        counter.append(count, controls);
        //this creates the box for the first rwo of buttons

        //Cash counter gets +5/-5 buttons also for ease of player use
        if (i === 4) {
          const row2 = document.createElement('div');
          row2.className = 'row';
          row2.append(makeButton('-25', -25, i, 'twenty-five'), makeButton('+25', 25, i, 'twenty-five'));
          controls.prepend(row2);
        }
        container.append(counter);
      }
      //this creates the box for the second row of buttons for the 5th counter
      render();
    </script>      
  </body>
</html>
